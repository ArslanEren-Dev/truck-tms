[build-system]
requires = ["setuptools>=77"]  # SPDX "license" + "license-files" (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "truck-tms"
version = "0.7.0"
description = "Simple open-source Transportation Management System (TMS) for small trucking fleets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ArslanEren-Dev" }]
requires-python = ">=3.12"
dependencies = ["PySide6>=6.5"]
keywords = ["tms", "trucking", "logistics", "fleet", "dispatch", "pyside6"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://arslaneren-dev.github.io/truck-tms/"
Repository = "https://github.com/ArslanEren-Dev/truck-tms"
Issues = "https://github.com/ArslanEren-Dev/truck-tms/issues"
Download = "https://github.com/ArslanEren-Dev/truck-tms/releases/latest"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-timeout>=2", "ruff>=0.6"]

[project.gui-scripts]
truck-tms = "truck_tms.__main__:main"

[tool.setuptools.packages.find]
include = ["truck_tms*"]

[tool.setuptools.package-data]
truck_tms = ["assets/*.ico", "assets/*.svg"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# errors, bugbear, modern syntax, simplifications, comprehensions, performance
select = ["E", "F", "W", "B", "UP", "SIM", "C4", "PIE", "PERF"]
# kept on purpose: try/except/pass reads clearer in Qt clean-up code, explicit loops and
# if/else blocks are easier to follow, and dict(...) keyword calls read well in tests
ignore = ["SIM105", "SIM108", "PERF401", "C408"]

[tool.ruff.lint.per-file-ignores]
"truck_tms/i18n.py" = ["E501"]  # one translation per line, even when it is long

[tool.pytest.ini_options]
# a test that hangs (e.g. on a dialog) fails with a stack trace instead of blocking CI for hours
timeout = 120
testpaths = ["tests"]
