[build-system]
requires = ["setuptools>=77"]  # SPDX "license" + "license-files" (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "truck-tms"
version = "0.5.0"
description = "Simple open-source Transportation Management System (TMS) for small trucking fleets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ArslanEren-Dev" }]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]
keywords = ["tms", "trucking", "logistics", "fleet", "dispatch", "pyside6"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://arslaneren-dev.github.io/truck-tms/"
Repository = "https://github.com/ArslanEren-Dev/truck-tms"
Issues = "https://github.com/ArslanEren-Dev/truck-tms/issues"
Download = "https://github.com/ArslanEren-Dev/truck-tms/releases/latest"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.gui-scripts]
truck-tms = "truck_tms.__main__:main"

[tool.setuptools.packages.find]
include = ["truck_tms*"]

[tool.setuptools.package-data]
truck_tms = ["assets/*.ico", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
