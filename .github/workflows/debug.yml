name: debug-crash
on: workflow_dispatch
jobs:
  dbg:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core gdb
      - run: pip install -e ".[dev]"
      - run: python -X faulthandler -m pytest tests/test_gui.py -x -v -s -p no:faulthandler -k "every_tab_opens" 2>&1 | tail -60
      - run: gdb -batch -ex run -ex bt --args python -m pytest tests/test_gui.py -x -q -s -p no:faulthandler -k "every_tab_opens and light-en" 2>&1 | tail -60